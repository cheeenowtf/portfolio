<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio — projects, skills and experience." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="logo" id="logo">C.</a>
      <nav>
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="eyebrow" id="heroRole"></p>
      <h1 id="heroName"></h1>
      <p class="lead" id="heroTagline"></p>
      <div class="hero-actions">
        <a href="#work" class="btn primary">View my work</a>
        <a href="#contact" class="btn">Get in touch</a>
      </div>
      <p class="meta" id="heroLocation"></p>
    </section>

    <section id="work" class="wrap section">
      <div class="section-head">
        <h2>Selected work</h2>
        <div class="filters" id="filters" role="tablist"></div>
      </div>
      <div class="grid" id="projects"></div>
    </section>

    <section id="about" class="wrap section about">
      <div>
        <h2>About</h2>
        <div id="aboutText"></div>
        <a id="resumeLink" class="btn" target="_blank" rel="noopener">Download résumé</a>
      </div>
      <div class="skills" id="skills"></div>
    </section>

    <section id="experience" class="wrap section">
      <h2>Experience</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="contact" class="wrap section contact">
      <h2>Let's work together</h2>
      <p class="lead">Have a project in mind or just want to say hi? My inbox is open.</p>
      <a id="emailLink" class="email"></a>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="wrap footer">
    <span id="copyright"></span>
    <a href="#top">Back to top ↑</a>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
